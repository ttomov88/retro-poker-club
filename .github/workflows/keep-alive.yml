# Free Supabase projects pause after 7 days without activity.
# This pings the database once a day so it stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl --fail --silent --show-error -X POST \
            "https://oxquuqjzyksgamrhfcdf.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_YMNEFcARbQw7grG3EnYCSQ_Q4YGzKLH" \
            -H "Content-Type: application/json" -d '{}'
